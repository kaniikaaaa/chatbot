[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-sdk"
version = "0.1.0"
description = "Lightweight LLM provider wrapper with inference telemetry"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "openai>=1.40",
    "anthropic>=0.34",
    "google-generativeai>=0.7",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["llm_sdk*"]
