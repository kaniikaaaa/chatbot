apiVersion: apps/v1
kind: Deployment
metadata: { name: chatbot-api }
spec:
  replicas: 2
  selector: { matchLabels: { app: chatbot-api } }
  template:
    metadata: { labels: { app: chatbot-api } }
    spec:
      containers:
        - name: chatbot-api
          image: chatbot/chatbot-api:latest
          imagePullPolicy: IfNotPresent
          env:
            - { name: INGESTION_URL, value: "http://ingestion:8001/v1/logs" }
            - { name: DEFAULT_PROVIDER, value: "openai" }
            - { name: DEFAULT_MODEL,    value: "gpt-4o-mini" }
            - { name: PII_REDACT,       value: "1" }
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: postgres-credentials, key: DATABASE_URL } }
          envFrom:
            - secretRef: { name: provider-keys }
          ports: [{ containerPort: 8000 }]
          readinessProbe:
            httpGet: { path: /healthz, port: 8000 }
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata: { name: chatbot-api }
spec:
  selector: { app: chatbot-api }
  ports: [{ port: 8000, targetPort: 8000 }]
