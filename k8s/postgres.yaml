apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
data:
  init.sql: |
    -- Mirror of db/init.sql; keep in sync.
    CREATE EXTENSION IF NOT EXISTS "pgcrypto";
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          envFrom:
            - secretRef: { name: postgres-credentials }
          ports: [{ containerPort: 5432 }]
          volumeMounts:
            - { name: data,    mountPath: /var/lib/postgresql/data }
            - { name: initsql, mountPath: /docker-entrypoint-initdb.d }
      volumes:
        - name: initsql
          configMap: { name: postgres-init }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 10Gi } }
---
apiVersion: v1
kind: Service
metadata: { name: postgres }
spec:
  selector: { app: postgres }
  ports: [{ port: 5432 }]
