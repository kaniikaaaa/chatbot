# Copy to secrets.yaml and fill in real values; do not commit secrets.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: provider-keys
type: Opaque
stringData:
  OPENAI_API_KEY: ""
  ANTHROPIC_API_KEY: ""
  GOOGLE_API_KEY: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
type: Opaque
stringData:
  POSTGRES_USER: chatbot
  POSTGRES_PASSWORD: chatbot
  POSTGRES_DB: chatbot
  DATABASE_URL: postgres://chatbot:chatbot@postgres:5432/chatbot
