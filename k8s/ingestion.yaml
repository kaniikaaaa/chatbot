apiVersion: apps/v1
kind: Deployment
metadata: { name: ingestion }
spec:
  replicas: 2
  selector: { matchLabels: { app: ingestion } }
  template:
    metadata: { labels: { app: ingestion } }
    spec:
      containers:
        - name: ingestion
          image: chatbot/ingestion:latest
          imagePullPolicy: IfNotPresent
          env:
            - { name: REDIS_URL, value: "redis://redis:6379" }
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: postgres-credentials, key: DATABASE_URL } }
          ports: [{ containerPort: 8001 }]
          readinessProbe:
            httpGet: { path: /healthz, port: 8001 }
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata: { name: ingestion }
spec:
  selector: { app: ingestion }
  ports: [{ port: 8001, targetPort: 8001 }]
